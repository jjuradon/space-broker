<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Review plan — <strong>{{ selectedCount }}</strong> of {{ plan.length }} selected</span>
    <div>
      <button type="button" class="btn btn-sm btn-outline-secondary me-2" (click)="toggleAll(true)">Select all</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="toggleAll(false)">Deselect all</button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-sm mb-0 align-middle">
      <thead>
        <tr>
          <th class="checkbox-col"></th>
          <th class="action-col">Action</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let group of form.controls; let i = index" [formGroup]="group">
          <td><input type="checkbox" class="form-check-input" formControlName="selected" /></td>
          <td><span class="badge" [ngClass]="kindBadgeClass(plan[i].kind)">{{ plan[i].kind }}</span></td>
          <td>{{ plan[i].description }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card-footer text-end">
    <button type="button" class="btn btn-primary" [disabled]="selectedCount === 0" (click)="onConfirm()">
      Confirm selected changes
    </button>
  </div>
</div>
